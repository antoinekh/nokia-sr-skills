name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: ShellCheck
        run: shellcheck skills/nokia-sr/scripts/ensure-yang.sh tests/*.sh
      - name: Run tests
        run: bash tests/test_ensure_yang.sh
      - name: Validate the skill (Agent Skills spec)
        run: uvx --from 'git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref' skills-ref validate skills/nokia-sr
      - name: Validate the plugin manifests
        run: npx -y @anthropic-ai/claude-code@2.1.295 plugin validate --strict .
